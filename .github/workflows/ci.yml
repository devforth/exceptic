name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs the same checks before it publishes.
  workflow_call:

# A new push to a pull request stops its older run: only the latest commits
# matter there. Runs on main and releases are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          # Pinned: a new release can add checks and break CI on unchanged code.
          version: v2.15.0
      - run: make test
      # Fails while the code calls a function with a known vulnerability; the fix is a newer Go or module.
      - run: make vulncheck

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The pnpm version comes from packageManager in web/package.json.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make web-check web
      # Checks the built page against what the Go server expects of it.
      - run: go test ./web

  docker:
    runs-on: ubuntu-latest
    needs: [test, web]
    steps:
      - uses: actions/checkout@v4
      # No QEMU needed: Go cross-compiles on the build platform and the final stage has no RUN steps.
      - uses: docker/setup-buildx-action@v3

      - name: Build image (amd64) and check size
        run: |
          docker buildx build --load --platform linux/amd64 -t devforth/exceptic:ci .
          make image-size VERSION=ci

      - name: Build image (arm64)
        run: docker buildx build --platform linux/arm64 .
