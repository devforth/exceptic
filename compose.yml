# Example deployment: `docker compose up -d`, then open http://localhost:8000.
# Put the settings in .env next to this file (docs/configuration.md; a minimal one in docs/deployment.md).
services:
  exceptic:
    image: devforth/exceptic:latest # in production pin X.Y (docs/deployment.md)
    restart: unless-stopped
    # Time to finish requests and write queued notifications before Docker kills it (default 10 s).
    stop_grace_period: 30s
    ports:
      # Behind a reverse proxy on the same host: "127.0.0.1:8000:8000" and TRUSTED_PROXIES (docs/deployment.md)
      - "8000:8000"
    env_file: .env
    volumes:
      - data:/data

volumes:
  data:

# Behind a reverse proxy, a fixed subnet keeps the gateway address for TRUSTED_PROXIES (172.30.0.1) the same:
# networks:
#   default:
#     ipam:
#       config:
#         - subnet: 172.30.0.0/24
